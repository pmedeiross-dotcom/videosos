name: AI Film Studio backend tests

on:
  push:
    branches:
      - ai-film-studio-foundation
    paths:
      - "backend/**"
      - ".github/workflows/ai-film-studio-backend.yml"
  pull_request:
    branches:
      - main
      - ai-film-studio-foundation
    paths:
      - "backend/**"
      - ".github/workflows/ai-film-studio-backend.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
